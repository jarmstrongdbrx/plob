# Databricks Asset Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "plob"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-0e0b539f-0c6d.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-0e0b539f-0c6d.cloud.databricks.com
      # We always use /Users/john.armstrong@databricks.com for all resources to make sure we only have a single copy.
      root_path: /Users/john.armstrong@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as john.armstrong@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: john.armstrong@databricks.com

resources:
  schemas:
    policy:
      catalog_name: prod_lakehouse
      name: policy
  
  volumes:
    raw_landing_zone:
      catalog_name: prod_lakehouse
      schema_name: policy
      name: raw_landing_zone
      volume_type: MANAGED
